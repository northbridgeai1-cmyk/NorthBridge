# Settings for GitHub Pages, which publishes this folder as meetnorthbridge.com.
#
# "exclude" lists working files that live in the repository but should NOT be
# reachable on the public website. Before this file existed, anyone could open
# meetnorthbridge.com/PRD.md or /tests/site.test.mjs.
# The pages, styles, scripts, images, robots.txt, sitemap.xml, llms.txt,
# llms-full.txt, agents.md and for-agents/ are all still published.
exclude:
  - README.md
  - GUIDE.md
  - PRD.md
  - DESIGN.md
  - tests
  - version-assets.py
  - founder
  - reels
  - node_modules
